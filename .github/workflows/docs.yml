#
# Build the documentation site, the manual PDF and the module API reference PDF
# from docs/ with Grimoire, and publish them to GitHub Pages, through Grimoire's
# shared workflow: https://grimoire.jennifer-lang.dev/github-pages.html
#
# The site root is the documentation as it stood at the highest release tag
# (plain MAJOR.MINOR.PATCH, the tags release.yml builds), so a reader of the
# latest release reads that release's documentation; unreleased documentation
# is not published (no /dev/; `dev` defaults to false). A pull request builds
# the site and runs the checks but never publishes.
#
# `uses` and `image` are pinned to the same Grimoire release; move both
# together. `prepare` needs Grimoire 0.4.1 or later.
#
# Repository settings (one-time): Pages built by "GitHub Actions", and the
# `github-pages` environment allowed to deploy from tags (a deployment tag rule
# `[0-9]*.[0-9]*.[0-9]*`).

name: docs

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  # Republishes the latest release: after a Pages outage, or when only the
  # Grimoire pin moved.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    # Publishes to GitHub; skipped on the project's Forgejo, which runs this too.
    if: github.server_url == 'https://github.com'
    # A called workflow can narrow what it is given but never widen it, so the
    # Pages deployment permissions are granted here.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: jennifer-language/grimoire/.github/workflows/docs-pages.yml@0.4.1
    with:
      image: ghcr.io/jennifer-language/grimoire:0.4.1
      # The manual PDF (book-output/jennifer-manual.pdf). It omits the module
      # API reference and the coverage report through `[pdf] exclude` in
      # grimoire.toml: large, tabular, machine-generated pages that read poorly
      # in the printed manual.
      args: --pdf
      # Runs in the checkout being built (the release tag), so everything is
      # generated from the code the published documentation describes. The
      # runner's Go fetches the go.mod toolchain if it is older.
      #
      # - docs/api/ and the "Module API Reference" region of docs/SUMMARY.md come
      #   from each module's doc comments, and docs/technical/coverage.md and the
      #   SUMMARY "coverage" region from `go test -cover` and `jennifer test
      #   --coverage`. Neither is committed (gitignored).
      # - The standalone module API reference PDF, rendered from docs/api/ by
      #   grimoire-api.toml (`src = "docs/api"`) in the build image, lands in
      #   docs/api/, so the site build copies it beside the API pages, where the
      #   index's "single PDF" link points.
      # - The go-import vanity page: the Go module path is
      #   jennifer-lang.dev/jennifer, so `go get` reads the go-import meta tag
      #   at https://jennifer-lang.dev/jennifer?go-get=1. Put under docs/, it is
      #   copied through to /jennifer/ like any non-Markdown file.
      prepare: |
        go build -o jennifer ./cmd/jennifer
        ./jennifer run scripts/gen-module-docs.j
        JENNIFER=./jennifer sh scripts/gen-coverage-docs.sh
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
          "$IMAGE" pdf -c grimoire-api.toml --out /work/docs/api
        mkdir -p docs/jennifer
        cp site/jennifer/index.html docs/jennifer/index.html
      # What a reader or `go get` needs, so a silently incomplete publish fails
      # here instead of on the live site.
      check: |
        test -s "$SITE/jennifer-manual.pdf"
        test -s "$SITE/api/jennifer-module-api.pdf"
        grep -q 'name="go-import" content="jennifer-lang.dev/jennifer git ' "$SITE/jennifer/index.html"
        test -f "$SITE/api/index.html"
