#
# Build the mdBook documentation site from docs/ and publish to
# GitHub Pages on every push to main. The repository must have
# GitHub Pages enabled in Settings -> Pages with "GitHub Actions"
# as the source (a one-time manual step).

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages-deploy requires `pages: write` and `id-token: write`.
# `contents: read` is the default but stated for clarity.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment may run at a time. Don't cancel an
# in-flight deploy mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mdBook
        env:
          # Pinned mdBook version. Bump in lockstep with the local
          # version used to verify book.toml's compatibility - 0.5.x
          # dropped a few 0.4.x-era fields (e.g. `multilingual`), so
          # straying across that boundary will surface as build
          # errors here.
          MDBOOK_VERSION: '0.5.3'
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          # Direct download from rust-lang/mdBook's release assets.
          # This pattern is the one documented in mdBook's own
          # deployment guide; it removes a third-party-action
          # dependency and gives us explicit URL control.
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Sanity-check it's actually executable and the version
          # matches what we pinned.
          "$HOME/.local/bin/mdbook" --version

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Render the PDF (without the API reference)
        # The manual PDF deliberately excludes the module API reference: it is a
        # large, tabular, machine-generated surface (~1000 pages) that reads poorly
        # in the prose manual's stylesheet. Build the book BEFORE generating the
        # API pages - the committed SUMMARY.md has an empty api region, so this
        # build has no API section - and render the PDF from that api-less book.
        # Stash it in $RUNNER_TEMP because the second `mdbook build` below wipes
        # book-output; it is copied back in after the api-inclusive HTML build.
        run: |
          mdbook build
          sh scripts/gen-pdf.sh "$RUNNER_TEMP/jennifer-manual.pdf"

      - name: Generate the module API reference
        # docs/api/ and the "Module API Reference" region of docs/SUMMARY.md are
        # generated from each module's doc comments (via the docblock module) and
        # are NOT committed (see .gitignore). Regenerate them here, before the
        # book build, so the published API reference is always in step with the
        # code. `go run` compiles the interpreter and runs the generator in one
        # step - no separate binary build needed for this one program.
        run: go run ./cmd/jennifer run scripts/gen-module-docs.j

      - name: Generate the test coverage report
        # docs/technical/coverage.md and the SUMMARY "coverage" region are
        # generated from `go test -cover` (system libraries) and `jennifer test
        # --coverage` (modules); they are NOT committed (gitignored) and are
        # excluded from the PDF (rendered earlier from the report-less book).
        # Build the interpreter once so the ~67 per-module coverage runs reuse it
        # rather than each recompiling under `go run`.
        run: |
          go build -o jennifer ./cmd/jennifer
          JENNIFER=./jennifer sh scripts/gen-coverage-docs.sh

      - name: Build the book
        run: mdbook build

      - name: Add the go-import vanity page
        # The Go module path is jennifer-lang.dev/jennifer, so `go get` fetches
        # https://jennifer-lang.dev/jennifer?go-get=1 and reads the go-import
        # meta tag. Copy the static page into the Pages output so the apex
        # serves it at /jennifer alongside the docs. Runs after `mdbook build`
        # (which cleans book-output) and before the artifact upload.
        run: |
          mkdir -p book-output/jennifer
          cp site/jennifer/index.html book-output/jennifer/index.html

      - name: Restore the manual PDF into the site
        # The PDF was rendered earlier from the api-less book and stashed in
        # $RUNNER_TEMP (the api-inclusive `mdbook build` above wiped book-output).
        # Copy it back so it deploys alongside the HTML and the introduction page's
        # link (jennifer-manual.pdf) resolves.
        run: cp "$RUNNER_TEMP/jennifer-manual.pdf" book-output/jennifer-manual.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book-output

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
