#
# PR gate: runs the full Go test suite and a TinyGo build on every
# push to main and every pull request. Linux amd64 only - the same
# pure-Go interpreter cross-compiles cleanly to arm64 and the other
# supported platforms, so per-arch test runs would not catch
# additional bugs at this stage. Cross-arch builds live in
# release.yml.

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: go test + tinygo build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version codegen reads `git describe --tags --long`,
          # so a shallow checkout would produce a `dev` version
          # marker on PR runs. Full history is cheap on this repo.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: '0.41.1'

      - name: Show toolchain versions
        run: |
          go version
          tinygo version

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install JUnit reporter
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: go test (coverage + JUnit report)
        # Pipefail makes a test failure fail the step even though the output
        # is piped through the reporter: the leftmost `go test` sets the
        # pipeline status, go-junit-report writes report.xml before exiting,
        # and -set-exit-code is belt-and-braces. Readable log is teed aside.
        run: |
          set -o pipefail
          go test -v -covermode=atomic -coverprofile=cover.out ./... 2>&1 \
            | tee test-output.log \
            | "$(go env GOPATH)/bin/go-junit-report" -set-exit-code > report.xml

      - name: Coverage report (HTML + summary)
        if: always()
        run: |
          [ -f cover.out ] || exit 0
          go tool cover -func=cover.out | tee coverage-summary.txt
          go tool cover -html=cover.out -o coverage.html

      - name: Upload test and coverage reports
        # On success and failure, so a red build still yields the JUnit
        # report and whatever coverage was collected.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            report.xml
            coverage.html
            coverage-summary.txt
            test-output.log
          if-no-files-found: warn

      - name: make build (both binaries)
        run: make build

      - name: Smoke-test the Go binary (default)
        run: ./jennifer run examples/hello.j

      - name: Smoke-test the TinyGo binary (constrained)
        run: ./jennifer-tiny run examples/hello.j

      - name: Lint the examples
        # Gate on the linter: any finding at or above the severity floor
        # (warning) fails the build. --format=github surfaces findings as
        # inline PR annotations. Lint is a default-binary-only dev feature,
        # so this uses ./jennifer (built by `make build` above).
        run: |
          # Top-level examples are curated golden tests, kept within the line
          # limit, so every check runs.
          ./jennifer lint --format=github examples/*.j
          # The module demos under examples/modules/ also illustrate real usage:
          # their docblocks fully describe the module, and they embed realistic
          # data (JSON payloads, HTML/template strings, URLs) that reads worse if
          # broken, so they legitimately run long. Exclude only the cosmetic
          # line-length check (L203) for them - every correctness / lifecycle /
          # other-style check still runs and still gates.
          ./jennifer lint --format=github --checks='!L203' examples/modules/*.j

      - name: Lint the shipped modules
        # Lint modules/ too. Two scope decisions:
        #  - Drop only the nesting / line-length checks (L202/L203), the same
        #    cosmetic pair examples/modules/ drops. L201 (method-size) stays on,
        #    so it still gates every module; the handful of parser-heavy files
        #    whose dispatch/VM methods legitimately run long opt out per file
        #    with a named `# lint-disable-file: L201` (grep-able, self-documenting)
        #    rather than a blanket exclusion here.
        #  - Lint each module once. An include-partial is named `*.inc.j` and is
        #    spliced into its parent, so linting the parent already covers it;
        #    listing the partial again would double-report every finding (and
        #    ical_vcard_shared.inc.j, shared by ical.j and vcard.j, thrice). So the
        #    glob simply skips `*.inc.j`. The *_test.j overlays are linted too (they
        #    caught real dead code), and they never include their module, so no
        #    module finding is double-counted through one.
        run: |
          set -euo pipefail
          targets=()
          for m in modules/*.j; do
            case "$m" in *.inc.j) continue ;; esac
            targets+=("$m")
          done
          echo "linting ${#targets[@]} module file(s); *.inc.j include-partials are covered via their parents"
          ./jennifer lint --format=github --checks='!L202,!L203' "${targets[@]}"

      - name: Check doc comments (docblock)
        # Gate on the docblock parser: a doc comment that drifts from its code
        # (a @param / @field that names nothing real, an undocumented parameter)
        # or an orphaned doc comment fails the build, so docs stay in step with
        # the code across the examples and the shipped modules. Uses ./jennifer
        # (built by `make build` above) via scripts/docblock-check.sh.
        run: |
          scripts/docblock-check.sh examples/
          scripts/docblock-check.sh modules/

      - name: Smoke-check the module API doc generator
        # The API reference (docs/api/) is generated at publish time by docs.yml,
        # not committed (see .gitignore), so there is nothing to diff here. Instead
        # run the generator against ./jennifer (from `make build` above) to catch a
        # crash - a module whose doc comments break docblock.parse, or a generator
        # regression - in PR CI rather than only at deploy time. The generator
        # rewrites the SUMMARY.md api region and writes the gitignored docs/api/
        # pages, so restore SUMMARY.md afterward to leave the tree clean. (The
        # single-file API PDF is built by Grimoire from this Markdown at deploy
        # time; the markdown.toPdf render path is covered by the module overlays.)
        run: |
          ./jennifer run scripts/gen-module-docs.j
          git checkout -- docs/SUMMARY.md

      - name: Run the Jennifer test suite
        # Exercises the `testing` assertion vocabulary and the `jennifer
        # test` runner end to end on a .j suite. Non-zero exit (a failing
        # assertion, or a runner error) fails the build. TAP output is
        # readable in the CI log and consumable by TAP-aware reporters.
        run: ./jennifer test --format=tap examples/testsuite.j

      - name: Run the shipped module tests
        # Every module in modules/ ships a white-box `MODULE_test.j` overlay
        # (see modules/README.md); each must pass 100%. A failure fails the
        # build, so a broken module never reaches a release. All overlays run
        # (rc accumulates) so every failure shows, not just the first.
        run: |
          shopt -s nullglob
          rc=0
          tested=0
          for t in modules/*_test.j; do
            echo "== $t =="
            ./jennifer test "$t" || rc=1
            tested=$((tested + 1))
          done
          echo "ran $tested module test overlay(s)"
          exit $rc

      - name: Guard - every packaging path installs the shipped modules
        # Bare `import "name.j";` resolves under the system module dir
        # (/usr/share/jennifer/modules), so every packaging path must install the
        # importable modules there. This shipped broken once (no path installed
        # any of them). Guard that each packaging file installs them, that no
        # *_test.j overlay leaks in, that the count matches, and that the staged
        # set actually resolves as bare imports (ical also exercises an
        # include-partial, ical_vcard_shared.inc.j).
        run: |
          set -euo pipefail
          for f in packaging/arch/PKGBUILD-bin packaging/arch/PKGBUILD-git \
                   scripts/build-deb.sh .github/workflows/release.yml; do
            grep -q 'share/jennifer/modules' "$f" \
              || { echo "::error file=$f::does not install modules into share/jennifer/modules"; exit 1; }
          done
          stage="$(mktemp -d)/modules"
          mkdir -p "$stage"
          for m in modules/*.j; do
            case "$m" in *_test.j) continue ;; esac
            cp "$m" "$stage/"
          done
          if ls "$stage"/*_test.j >/dev/null 2>&1; then
            echo "::error::a *_test.j overlay leaked into the installed modules"; exit 1
          fi
          expected=$(ls modules/*.j | grep -vc _test.j)
          actual=$(ls "$stage"/*.j | wc -l)
          [ "$expected" = "$actual" ] \
            || { echo "::error::staged $actual modules, expected $expected"; exit 1; }
          printf 'import "csv.j" as csv;\nimport "ical.j" as ical;\nuse time;\ndef n as int init len(csv.parse("a,b"));\ndef ev as ical.Event init ical.event("x", time.utc(), time.utc(), "ok");\n' \
            | ./jennifer run --sysmoddir="$stage" -
          echo "ok: $actual importable modules install and resolve as bare imports"

      - name: Smoke-run the module example programs
        # The golden walker only covers top-level examples/*.j; the module /
        # include demos live in subdirs and aren't golden-checked. Smoke-run
        # each entry program (main.j / *_demo.j) so an API change that breaks
        # a demo fails the build. Only entry points run: module and included
        # files (config.j, db.j, greetinglib.j) are not standalone programs
        # (running one directly is a deliberate error), so the glob excludes
        # them, as it does the *_test.j overlays.
        run: |
          shopt -s nullglob
          rc=0
          ran=0
          for ex in examples/*/main.j examples/*/*_demo.j; do
            echo "== $ex =="
            ./jennifer run "$ex" || rc=1
            ran=$((ran + 1))
          done
          echo "smoke-ran $ran example program(s)"
          exit $rc

      - name: Run the benchmark suite (regression check)
        # Only on the main target, linux/amd64. This job runs on a single
        # ubuntu-latest (x64) runner today, so the guard is belt-and-braces:
        # it keeps the benchmark off any arm64 / macOS / Windows row a future
        # matrix might add, where the numbers would be noise anyway.
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
        timeout-minutes: 30
        # Runs examples/benchmark.j on both binaries as a smoke / regression
        # signal: it catches a performance-path change that hangs or crashes.
        # `--suite all` exercises both the v1 interpreter-throughput workload
        # and the v2 numeric-library workload (stats / linalg / math / ml), so a
        # hang / crash in either path fails the build. The numbers themselves
        # are NOT authoritative - a shared CI runner is too noisy for that, and
        # published figures come from the reference machine - so nothing is
        # captured; a non-zero exit (or a timeout) is what fails the build.
        run: |
          ./jennifer run examples/benchmark.j --suite all
          ./jennifer-tiny run examples/benchmark.j --suite all

      - name: em-dash scan (project rule)
        run: |
          # No usage of U+2014 (em-dash) and U+2013 (en-dash)
          # anywhere in the repository. The pattern uses PCRE
          # byte-escape so this YAML itself stays clean - the
          # offending characters never appear in the source.
          if grep -rPn '\xe2\x80\x94|\xe2\x80\x93' \
              --include='*.md' --include='*.go' --include='*.j' \
              --include='*.yml' --include='*.yaml' --include='*.toml' \
              --include='*.sh' --include='*.bash' --include='*.1' \
              --include='PKGBUILD*' --include='Makefile' --include='*.sublime-syntax' \
              --exclude-dir=.git --exclude-dir=book-output \
              .; then
            echo "em-dash or en-dash found - use plain ASCII '-' instead"
            exit 1
          fi
