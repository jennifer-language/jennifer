#
# Build and push the Jennifer container images to GHCR.
#
# On a version tag (a release) - three multi-arch variants from
# packaging/docker/Dockerfile:
#   slim   -> ghcr.io/<owner>/jennifer:<ver>, :<major>.<minor>, :latest
#   alpine -> ghcr.io/<owner>/jennifer:<ver>-alpine, :alpine
#   static -> ghcr.io/<owner>/jennifer:<ver>-static, :static
# The floating tags (:latest, :alpine, :static) move only when the pushed tag is
# the highest MAJOR.MINOR.PATCH release tag, so a patch to an older line
# (0.24.1 after 0.25.0) gets its version tags and leaves them alone. Every
# metadata step sets flavor latest=false: metadata-action otherwise adds a
# plain :latest to any step with a type=semver tag, which made :latest the
# static image.
#
# On every push to main (the bleeding edge) - the slim variant only, tagged
#   ghcr.io/<owner>/jennifer:dev  (and :main, the same image)
# These are moving tags: each main build overwrites the previous one, so :dev is
# always "the latest commit on main". The image reports a generic meta.VERSION of
# "dev" (no commit id). :latest and the version tags are never touched by a main
# push - they stay pinned to releases. The alpine and static variants are
# release-only (a per-commit build of each would multiply the build for little
# gain).
#
# Both release arches are linux/amd64 + linux/arm64, cross-compiled on the amd64
# runner (Go and TinyGo honour GOARCH), so only the slim stage's tiny apt step
# and the alpine stage's apk step touch QEMU. Independent of release.yml - the
# image build is self-contained from source.

name: docker

on:
  push:
    branches:
      - main
    tags:
      # Same bare-version glob as release.yml (e.g. `0.21.0`, no `v` prefix).
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

# One in-flight build per ref: rapid pushes to main supersede each other (only the
# newest commit's :dev image is built), while each tag has its own group and never
# gets cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jennifer

jobs:
  images:
    name: Build and push images (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # true only for the highest final release tag (pre-release tags such as
      # 0.26.0-rc1 never count); gates every floating tag below
      - name: Decide whether this is the newest release
        id: newest
        run: |
          newest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" = "$newest" ]; then
            echo latest=true >> "$GITHUB_OUTPUT"
          else
            echo latest=false >> "$GITHUB_OUTPUT"
          fi
          echo "pushed $GITHUB_REF_NAME; newest release tag: $newest"

      # ---- slim (default / :latest) ----
      - name: Metadata (slim)
        id: meta-slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.newest.outputs.latest == 'true' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push (slim)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: slim
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
          # A release build carries its version; a main build carries a generic
          # "dev" (no commit id) so :dev images all report the same meta.VERSION.
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          cache-from: type=gha,scope=slim
          cache-to: type=gha,scope=slim,mode=max

      # ---- alpine (:alpine) - release-only ----
      - name: Metadata (alpine)
        id: meta-alpine
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-alpine
            type=raw,value=alpine,enable=${{ steps.newest.outputs.latest == 'true' }}

      - name: Build and push (alpine)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: alpine
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          cache-from: type=gha,scope=alpine
          cache-to: type=gha,scope=alpine,mode=max

      # ---- static (distroless / :static) - release-only ----
      - name: Metadata (static)
        id: meta-static
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-static
            type=raw,value=static,enable=${{ steps.newest.outputs.latest == 'true' }}

      - name: Build and push (static)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: static
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-static.outputs.tags }}
          labels: ${{ steps.meta-static.outputs.labels }}
          cache-from: type=gha,scope=static
          cache-to: type=gha,scope=static,mode=max
